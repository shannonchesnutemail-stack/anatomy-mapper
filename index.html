<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neck Pain Mapper</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #667eea; min-height: 100vh; padding: 10px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #667eea; text-align: center; margin-bottom: 15px; }
        .screen { display: none; }
        .screen.active { display: block; }
        button { width: 100%; padding: 14px; margin: 10px 0; background: #667eea; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #5568d3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .green { background: #2ecc71; }
        .gray { background: #999; }
        input[type="file"] { display: none; }
        .photo-item { background: #f5f5f5; padding: 10px; margin: 5px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .photo-item button { width: 60px; padding: 5px; font-size: 12px; margin: 0; }
        #canvas { border: 2px solid #ddd; width: 100%; margin: 10px 0; cursor: crosshair; display: block; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; max-width: 350px; width: 100%; }
        .modal-content h3 { margin-bottom: 15px; }
        .modal-content label { display: block; font-weight: bold; margin-top: 10px; }
        .modal-content select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; }
        .modal-content input[type="range"] { width: 100%; margin: 10px 0; }
        .info { background: #e8f4f8; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        p { margin: 10px 0; color: #666; }
        .review-item { background: #f9f9f9; padding: 10px; margin: 8px 0; border-radius: 4px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Neck Pain Mapper</h1>

        <!-- SCREEN 1 -->
        <div id="s1" class="screen active">
            <h2>Step 1: Upload Photos</h2>
            <p>Choose photos to analyze</p>
            <button onclick="pickPhotos()">📱 Choose Photos</button>
            <div id="photoList"></div>
            <button id="btn-next-1" onclick="goScreen(2)" disabled style="margin-top: 20px;">Next →</button>
            <input type="file" id="files" accept="image/*" multiple>
        </div>

        <!-- SCREEN 2 -->
        <div id="s2" class="screen">
            <h2>Step 2: Mark Pain</h2>
            <p>Photo <span id="curr">1</span>/<span id="total">1</span></p>
            <canvas id="canvas"></canvas>
            <button onclick="undo()" style="width: 48%; display: inline-block; margin-right: 2%;">Undo</button>
            <button onclick="prev()" style="width: 48%; display: inline-block; margin-left: 2%;">Prev</button>
            <button onclick="next()" id="next-btn">Next</button>
            <button onclick="goScreen(3)" class="green">Done</button>
        </div>

        <!-- SCREEN 3 -->
        <div id="s3" class="screen">
            <h2>Step 3: Review</h2>
            <div id="review" style="background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; max-height: 200px; overflow-y: auto; font-size: 13px;"></div>
            <button onclick="makePDF()" class="green">📄 Generate PDF</button>
            <button onclick="goScreen(2)" class="gray">Back</button>
            <div id="msg"></div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>Pain Details</h3>
            <div class="info">Location: <strong id="loc">-</strong></div>
            
            <label>When does it hurt?</label>
            <select id="trigger">
                <option value="">Select...</option>
                <option>When touched</option>
                <option>Random times</option>
                <option>During stress</option>
                <option>When moving</option>
                <option>In cold</option>
            </select>

            <label>Pain type:</label>
            <select id="type">
                <option value="">Select...</option>
                <option>Sharp</option>
                <option>Dull</option>
                <option>Tension</option>
                <option>Burning</option>
                <option>Throbbing</option>
            </select>

            <label>Severity: <span id="num">5</span>/10</label>
            <input type="range" id="sev" min="1" max="10" value="5" onchange="document.getElementById('num').textContent = this.value">

            <button onclick="save()">Save</button>
            <button onclick="closeModal()" class="gray">Cancel</button>
        </div>
    </div>

    <script>
        let photos = [];
        let idx = 0;
        let marks = [];
        let pending = null;

        function pickPhotos() {
            document.getElementById('files').click();
        }

        document.getElementById('files').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            photos = [];
            let done = 0;

            files.forEach(f => {
                const r = new FileReader();
                r.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        photos.push({ img, marks: [] });
                        done++;
                        if (done === files.length) {
                            showPhotos();
                            document.getElementById('btn-next-1').disabled = false;
                        }
                    };
                    img.src = ev.target.result;
                };
                r.readAsDataURL(f);
            });
        });

        function showPhotos() {
            const list = document.getElementById('photoList');
            list.innerHTML = '';
            photos.forEach((_, i) => {
                const div = document.createElement('div');
                div.className = 'photo-item';
                div.innerHTML = `Photo ${i+1} <button onclick="delPhoto(${i})">Delete</button>`;
                list.appendChild(div);
            });
        }

        function delPhoto(i) {
            photos.splice(i, 1);
            showPhotos();
            if (photos.length === 0) document.getElementById('btn-next-1').disabled = true;
        }

        function goScreen(n) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('s' + n).classList.add('active');
            if (n === 2) loadPhoto(0);
            if (n === 3) buildReview();
        }

        function loadPhoto(i) {
            idx = i;
            marks = photos[i].marks || [];
            document.getElementById('curr').textContent = i + 1;
            document.getElementById('total').textContent = photos.length;
            
            document.getElementById('next-btn').textContent = i === photos.length - 1 ? 'Done' : 'Next';
            
            draw();
        }

        function draw() {
            const c = document.getElementById('canvas');
            const ctx = c.getContext('2d');
            const img = photos[idx].img;
            const w = c.parentElement.clientWidth - 4;
            const h = (w / img.width) * img.height;
            
            c.width = w;
            c.height = h;
            ctx.drawImage(img, 0, 0, w, h);
            
            marks.forEach(m => {
                ctx.fillStyle = '#FF6B6B';
                ctx.beginPath();
                ctx.arc(m.x, m.y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        function getLocation(x, y) {
            const c = document.getElementById('canvas');
            const xp = (x / c.width) * 100;
            const yp = (y / c.height) * 100;
            
            if (yp < 30) return xp < 40 ? 'Left Ear' : xp > 60 ? 'Right Ear' : 'Back Head';
            if (yp < 50) return xp < 35 ? 'Left Neck' : xp > 65 ? 'Right Neck' : 'Center Neck';
            if (yp < 70) return xp < 30 ? 'Left Shoulder' : xp > 70 ? 'Right Shoulder' : 'Lower Neck';
            return xp < 30 ? 'Left Trap' : xp > 70 ? 'Right Trap' : 'Upper Back';
        }

        document.getElementById('canvas').addEventListener('click', (e) => {
            const c = document.getElementById('canvas');
            const r = c.getBoundingClientRect();
            const x = e.clientX - r.left;
            const y = e.clientY - r.top;
            
            pending = { x, y, area: getLocation(x, y) };
            document.getElementById('loc').textContent = pending.area;
            document.getElementById('trigger').value = '';
            document.getElementById('type').value = '';
            document.getElementById('sev').value = 5;
            document.getElementById('num').textContent = 5;
            document.getElementById('modal').classList.add('active');
        });

        function save() {
            const t = document.getElementById('trigger').value;
            const ty = document.getElementById('type').value;
            const s = document.getElementById('sev').value;
            
            if (!t || !ty) return alert('Select trigger and type');
            
            marks.push({ x: pending.x, y: pending.y, area: pending.area, trigger: t, type: ty, sev: s });
            photos[idx].marks = marks;
            closeModal();
            draw();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function undo() {
            if (marks.length) {
                marks.pop();
                photos[idx].marks = marks;
                draw();
            }
        }

        function prev() {
            if (idx > 0) loadPhoto(idx - 1);
        }

        function next() {
            if (idx < photos.length - 1) loadPhoto(idx + 1);
            else goScreen(3);
        }

        function buildReview() {
            let h = '';
            photos.forEach((p, i) => {
                h += '<div class="review-item"><b>Photo ' + (i+1) + ':</b><br>';
                if (!p.marks || p.marks.length === 0) h += 'No marks<br>';
                else p.marks.forEach(m => {
                    h += m.area + ' | ' + m.type + ' | ' + m.trigger + ' | ' + m.sev + '/10<br>';
                });
                h += '</div>';
            });
            document.getElementById('review').innerHTML = h;
        }

        function makePDF() {
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                let y = 20;
                
                doc.setFontSize(18);
                doc.text('Neck Pain Assessment', 20, y);
                y += 12;
                
                doc.setFontSize(10);
                doc.text('Date: ' + new Date().toLocaleDateString(), 20, y);
                y += 10;
                
                photos.forEach((p, i) => {
                    if (!p.marks || !p.marks.length) return;
                    
                    if (y > 250) {
                        doc.addPage();
                        y = 20;
                    }
                    
                    doc.setFontSize(12);
                    doc.text('Photo ' + (i+1), 20, y);
                    y += 8;
                    
                    p.marks.forEach(m => {
                        if (y > 270) {
                            doc.addPage();
                            y = 20;
                        }
                        doc.setFontSize(10);
                        doc.text(m.area + ': ' + m.type, 25, y);
                        y += 5;
                        doc.setFontSize(9);
                        doc.text('Trigger: ' + m.trigger + ' | Severity: ' + m.sev + '/10', 30, y);
                        y += 6;
                    });
                    y += 5;
                });
                
                doc.addPage();
                y = 20;
                doc.setFontSize(12);
                doc.text('Anatomy Reference', 20, y);
                y += 10;
                doc.setFontSize(9);
                doc.text('TRAPEZIUS: Shoulder muscle\nLEVATOR SCAPULAE: Neck to shoulder\nSTERNOCLEIDOMASTOID: Neck muscle\nCERVICAL VERTEBRAE: C1-C7\nFACET JOINTS: Vertebral joints\nACCESSORY NERVE: Trapezius innervation', 20, y);
                
                doc.save('Pain_Assessment.pdf');
                document.getElementById('msg').innerHTML = '<div class="info success">✅ PDF saved to Downloads!</div>';
            } catch (e) {
                document.getElementById('msg').innerHTML = '<div class="info" style="background: #f8d7da; color: #721c24;">❌ Error: ' + e.message + '</div>';
            }
        }
    </script>
</body>
</html>

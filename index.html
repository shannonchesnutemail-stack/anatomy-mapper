<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Assessment Mapper</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,'Times New Roman',serif;background:#16283a;min-height:100vh;padding:10px;color:#1b2b3a}
.container{max-width:580px;margin:0 auto;background:#fff;padding:18px;border-radius:6px;box-shadow:0 6px 30px rgba(0,0,0,.35)}
h1{text-align:center;font-size:21px;letter-spacing:.5px;color:#16283a}
.sub{text-align:center;font-size:12px;color:#7b8b9a;font-style:italic;margin:4px 0 14px;padding-bottom:12px;border-bottom:2px solid #16283a}
h2{font-size:16px;margin:10px 0 6px}
.screen{display:none}.screen.active{display:block}
button{width:100%;padding:12px;margin:6px 0;background:#16283a;color:#fff;border:none;border-radius:4px;font-size:14px;font-family:Georgia,serif;font-weight:bold;cursor:pointer}
button:disabled{background:#c2ccd4}
.green{background:#1d6f42}.gray{background:#7b8b9a}.amber{background:#8a6d1f}
.small{width:auto;padding:7px 12px;font-size:12px;margin:0}
.row{display:flex;gap:7px}.row>*{flex:1}
input[type=file]{display:none}
.photo-item{background:#f3f5f7;padding:9px;margin:5px 0;border-radius:4px;display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
#canvas{width:100%;display:block;margin:8px 0;border:1px solid #c9d4de;background:#fff;touch-action:manipulation}
.instr{background:#eef3f8;border-left:4px solid #16283a;padding:9px 11px;font-size:13px;margin:8px 0;line-height:1.45}
.toggles button{background:#c2ccd4;color:#41525f}
.toggles .on{background:#16283a;color:#fff}
.sidebtns button{background:#c2ccd4;color:#41525f}
.sidebtns .on{background:#16283a;color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
.modal.active{display:flex}
.modal-content{background:#fff;padding:18px;border-radius:6px;max-width:350px;width:100%}
.modal-content label{display:block;font-weight:bold;margin-top:9px;font-size:12.5px}
.modal-content select,.modal-content input{width:100%;padding:8px;margin:4px 0;border:1px solid #c9d4de;border-radius:4px;font-family:Georgia,serif}
.info{background:#eef3f8;padding:9px 11px;margin:8px 0;border-radius:4px;font-size:13px}
.success{background:#e2f3e8;color:#14532d}.errbox{background:#fae3e5;color:#7f1d1d}
.review-item{background:#f7f9fb;padding:10px;margin:7px 0;border-radius:4px;font-size:12.5px;border-left:4px solid #16283a;line-height:1.5}
p{font-size:13px;color:#5b6b7a;margin:6px 0;line-height:1.5}
</style>
</head>
<body>
<div class="container">
  <h1>Anatomy Assessment Mapper</h1>
  <div class="sub">Annotated anatomical plates &amp; structural reference</div>

  <div id="s1" class="screen active">
    <h2>Step 1 &middot; Photographs</h2>
    <p>Add one or more reference photographs of the affected region.</p>
    <button onclick="document.getElementById('files').click()">Choose Photographs</button>
    <div id="photoList"></div>
    <button id="toS2" onclick="startWork()" disabled style="margin-top:12px">Continue to Calibration →</button>
    <input type="file" id="files" accept="image/*" multiple>
  </div>

  <div id="s2" class="screen">
    <h2>Step 2 &middot; Calibrate &amp; Mark <span id="pcount" style="font-weight:normal;color:#9aa8b5;font-size:12px"></span></h2>
    <div class="row sidebtns">
      <button class="small" id="sideL" onclick="setSide('left')">Left Side</button>
      <button class="small" id="sideR" onclick="setSide('right')">Right Side</button>
    </div>
    <div class="instr" id="instr"></div>
    <canvas id="canvas"></canvas>
    <div class="row toggles">
      <button class="small on" id="tgM" onclick="toggleLayer('muscle')">Muscles</button>
      <button class="small on" id="tgN" onclick="toggleLayer('nerve')">Nerves</button>
      <button class="small on" id="tgS" onclick="toggleLayer('skeletal')">Bone</button>
    </div>
    <div class="row" id="skipRow" style="display:none">
      <button class="amber" onclick="skipPt()">Skip — not visible in this photo</button>
    </div>
    <div class="row">
      <button class="gray" onclick="undoPt()">Undo</button>
      <button class="gray" onclick="recalib()">Recalibrate</button>
    </div>
    <div class="row">
      <button onclick="prevPhoto()" id="prevBtn">← Previous</button>
      <button onclick="nextPhoto()" id="nextBtn" class="green">Next →</button>
    </div>
  </div>

  <div id="s3" class="screen">
    <h2>Step 3 &middot; Review &amp; Generate</h2>
    <div id="review"></div>
    <button onclick="generateReport()" class="green">Generate Anatomy Guide (PDF)</button>
    <button onclick="goScreen(2)" class="gray">← Back to Plates</button>
    <div id="msg"></div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <h2 style="margin-bottom:8px">Mark Tender Area</h2>
    <div class="info">Structures beneath: <strong id="loc">—</strong></div>
    <label>When does it hurt?</label>
    <select id="trigger"><option value="">Select…</option><option>When touched</option><option>Random times</option><option>During stress</option><option>When moving</option><option>In cold</option></select>
    <label>Character of pain</label>
    <select id="type"><option value="">Select…</option><option>Sharp</option><option>Dull</option><option>Tension</option><option>Burning</option><option>Throbbing</option></select>
    <label>Severity: <span id="num">5</span>/10</label>
    <input type="range" id="sev" min="1" max="10" value="5" oninput="document.getElementById('num').textContent=this.value">
    <button onclick="saveMark()">Save</button>
    <button onclick="closeModal()" class="gray">Cancel</button>
  </div>
</div>
<script>
/* ===== anatomy_model.js ===== */
/* Canonical space: E(ear)=(0,0), N(neck base)=(0,1), S(shoulder tip)=(1,1) */
const ANATOMY = {
  trapezius: {
    id:'trapezius', name:'Trapezius (Upper)', short:'TRAPEZIUS', sys:'muscle', color:'#d9463d',
    outline:[[-0.10,-0.16],[0.30,-0.20],[0.72,-0.10],[1.02,0.62],[1.10,0.94],
             [0.72,1.12],[0.22,1.20],[-0.12,0.96],[-0.16,0.40]],
    curved:true, anchor:[0.45,0.30],
    desc:'Large, triangular muscle running from the skull and neck down to the shoulder blade and collarbone. The upper portion covers most of the visible neck-to-shoulder slope.',
    rel:'MOST LIKELY CANDIDATE — frequently causes tenderness in these exact areas due to posture, tension, or muscle strain.'
  },
  levator: {
    id:'levator', name:'Levator Scapulae', short:'LEVATOR SCAPULAE', sys:'muscle', color:'#a8322b',
    band:[[0.02,-0.02],[0.16,0.34],[0.34,0.70],[0.46,1.00]], w:0.085, anchor:[0.30,0.62],
    desc:'Deep muscle connecting the upper cervical spine (C1-C4) to the top inner corner of the shoulder blade. Lies beneath the trapezius.',
    rel:'STRONG CANDIDATE — deep muscle commonly responsible for referred pain into the lateral neck.'
  },
  scm: {
    id:'scm', name:'Sternocleidomastoid (SCM)', short:'SCM', sys:'muscle', color:'#e8743b',
    band:[[-0.02,0.00],[-0.16,0.36],[-0.30,0.74],[-0.38,1.06]], w:0.075, anchor:[-0.24,0.58],
    desc:'Thick strap muscle running diagonally from the mastoid bone behind the ear down to the collarbone and breastbone.',
    rel:'RELEVANT — present along the anterior-lateral neck; can refer pain toward the ear and jaw.'
  },
  splenius: {
    id:'splenius', name:'Splenius Capitis', short:'SPLENIUS CAPITIS', sys:'muscle', color:'#c2564e',
    band:[[0.14,-0.14],[0.06,0.18],[-0.02,0.52],[-0.06,0.86]], w:0.06, anchor:[0.02,0.40],
    desc:'Deep posterior neck muscle running from the upper thoracic/lower cervical spine up to the base of the skull.',
    rel:'POSSIBLE — tension here commonly produces headaches at the back of the head.'
  },
  scalene: {
    id:'scalene', name:'Scalene Muscles', short:'SCALENES', sys:'muscle', color:'#d3775f',
    band:[[-0.06,0.34],[0.02,0.60],[0.10,0.86],[0.14,1.02]], w:0.055, anchor:[0.04,0.74],
    desc:'Three deep muscles on the side of the neck running from the cervical vertebrae down to the first two ribs. The brachial plexus passes between them.',
    rel:'RELEVANT — tightness can compress the nerve bundle heading to the arm (thoracic outlet region).'
  },
  cn11: {
    id:'cn11', name:'Accessory Nerve (CN XI)', short:'CN XI', sys:'nerve', color:'#f0b429',
    band:[[0.04,0.02],[0.22,0.14],[0.42,0.28],[0.60,0.40]], w:0.018, anchor:[0.42,0.28],
    desc:'Cranial nerve passing through the posterior triangle of the neck. Supplies motor control to both the trapezius and sternocleidomastoid.',
    rel:'RELEVANT — irritation causes sharp, localized tenderness rather than a dull ache.'
  },
  cn10: {
    id:'cn10', name:'Vagus Nerve (CN X)', short:'CN X', sys:'nerve', color:'#e6c35c',
    band:[[-0.10,0.02],[-0.11,0.36],[-0.12,0.70],[-0.12,1.00]], w:0.016, anchor:[-0.115,0.52],
    desc:'Major nerve traveling down the lateral neck within the carotid sheath. Carries autonomic and sensory fibers.',
    rel:'PRESENT — rarely a direct pain source, but relevant if symptoms include dizziness or throat sensations.'
  },
  plexus: {
    id:'plexus', name:'Brachial Plexus', short:'BRACHIAL PLEXUS', sys:'nerve', color:'#f5a623',
    fan:{origin:[0.06,0.92], spread:[[0.62,0.86],[0.72,1.00],[0.70,1.14],[0.58,1.22]]},
    w:0.016, anchor:[0.52,1.02],
    desc:'Network of nerve roots (C5-T1) exiting the lower cervical spine and traveling under the collarbone toward the arm.',
    rel:'RELEVANT — irritation can cause radiating pain, numbness, or tingling down the arm.'
  },
  cspine: {
    id:'cspine', name:'Cervical Spine (C1-C7)', short:'CERVICAL SPINE', sys:'skeletal', color:'#cfe8f2',
    vertebrae:{a:[-0.02,-0.20], b:[0.04,1.02], n:7}, anchor:[0.01,0.42],
    desc:'The seven neck vertebrae and the small facet joints between them that permit neck rotation and bending.',
    rel:'POSSIBLE — facet joint irritation commonly causes one-sided neck pain that worsens with movement.'
  },
  clavicle: {
    id:'clavicle', name:'Clavicle (Collarbone)', short:'CLAVICLE', sys:'skeletal', color:'#e3d5a8',
    band:[[-0.20,1.06],[0.14,0.98],[0.52,0.96],[0.88,1.00]], w:0.055, anchor:[0.40,0.98],
    desc:'The collarbone — the landmark separating the neck and shoulder musculature above from the chest below.',
    rel:'LANDMARK — tenderness right at this junction may indicate the trapezius insertion or the AC joint.'
  },
  acjoint: {
    id:'acjoint', name:'Acromioclavicular (AC) Joint', short:'AC JOINT', sys:'skeletal', color:'#8fd3e8',
    dot:[0.95,0.99], anchor:[0.95,0.99],
    desc:'The small joint where the outer end of the collarbone meets the tip of the shoulder blade.',
    rel:'POSSIBLE — a common source of focal tenderness right at the point of the shoulder.'
  }
};
const SYS_META = {
  muscle:{label:'Muscle', legend:'Muscles'},
  nerve:{label:'Nerve', legend:'Nerves'},
  skeletal:{label:'Bone / Joint', legend:'Bone & Joints'}
};


/* ===== geom.js ===== */
/* smooth polyline through points via Catmull-Rom -> sampled points */
function catmullRom(pts, samples){
  if(pts.length<3) return pts.slice();
  const out=[];
  const P=[pts[0],...pts,pts[pts.length-1]];
  for(let i=0;i<P.length-3;i++){
    const p0=P[i],p1=P[i+1],p2=P[i+2],p3=P[i+3];
    for(let t=0;t<samples;t++){
      const s=t/samples, s2=s*s, s3=s2*s;
      out.push([
        0.5*((2*p1[0])+(-p0[0]+p2[0])*s+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*s2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*s3),
        0.5*((2*p1[1])+(-p0[1]+p2[1])*s+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*s2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*s3)
      ]);
    }
  }
  out.push(pts[pts.length-1]);
  return out;
}
/* offset a centerline into a closed ribbon of half-width w (tapered at ends) */
function ribbon(center, w, taper){
  const L=[],R=[];
  for(let i=0;i<center.length;i++){
    const a=center[Math.max(0,i-1)], b=center[Math.min(center.length-1,i+1)];
    let dx=b[0]-a[0], dy=b[1]-a[1];
    const len=Math.hypot(dx,dy)||1e-6; dx/=len; dy/=len;
    const nx=-dy, ny=dx;
    const t=i/(center.length-1);
    const bulge = taper ? Math.sin(Math.PI*Math.min(1,Math.max(0.001,t)))*0.45+0.55 : 1;
    const hw=w*bulge;
    L.push([center[i][0]+nx*hw, center[i][1]+ny*hw]);
    R.push([center[i][0]-nx*hw, center[i][1]-ny*hw]);
  }
  return L.concat(R.reverse());
}
function ptSegDist(p,a,b){
  const vx=b[0]-a[0], vy=b[1]-a[1], wx=p[0]-a[0], wy=p[1]-a[1];
  const c1=vx*wx+vy*wy;
  if(c1<=0) return Math.hypot(p[0]-a[0],p[1]-a[1]);
  const c2=vx*vx+vy*vy;
  if(c2<=c1) return Math.hypot(p[0]-b[0],p[1]-b[1]);
  const t=c1/c2;
  return Math.hypot(p[0]-(a[0]+t*vx), p[1]-(a[1]+t*vy));
}
function ptPolylineDist(p, pts){
  let d=Infinity;
  for(let i=0;i<pts.length-1;i++) d=Math.min(d, ptSegDist(p,pts[i],pts[i+1]));
  return d;
}
function pointInPoly(p, poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if(((yi>p[1])!=(yj>p[1])) && (p[0] < (xj-xi)*(p[1]-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}


/* ===== app_core.js ===== */
/* ============ CALIBRATION / TRANSFORM ============ */
const CALIB_STEPS = [
  {key:'ear',      label:'Tap the EAR / MASTOID — bony bump directly behind the ear', optional:false},
  {key:'occiput',  label:'Tap the BASE OF SKULL — bony midline bump at back of head', optional:true},
  {key:'neckBase', label:'Tap the BASE OF THE NECK — where neck meets the shoulder line', optional:false},
  {key:'shoulder', label:'Tap the SHOULDER TIP — outer point of the shoulder', optional:false},
  {key:'scapula',  label:'Tap the INNER SHOULDER BLADE EDGE — ridge on the upper back', optional:true}
];
function computeAffine(E,N,S){
  const w1={x:N.x-E.x,y:N.y-E.y}, w2={x:S.x-E.x,y:S.y-E.y};
  return { m11:w2.x-w1.x, m21:w2.y-w1.y, m12:w1.x, m22:w1.y, t:{x:E.x,y:E.y} };
}
function fwd(mat,p){ return [ mat.m11*p[0]+mat.m12*p[1]+mat.t.x, mat.m21*p[0]+mat.m22*p[1]+mat.t.y ]; }
function bwd(mat,p){
  const det=mat.m11*mat.m22-mat.m12*mat.m21;
  const dx=p[0]-mat.t.x, dy=p[1]-mat.t.y;
  return [ (mat.m22*dx-mat.m12*dy)/det, (-mat.m21*dx+mat.m11*dy)/det ];
}
function photoMat(photo){ return computeAffine(photo.calib.ear, photo.calib.neckBase, photo.calib.shoulder); }
function mirrorIfRight(photo, p){ return photo.side==='right' ? [-p[0], p[1]] : p; }

/* ============ BUILD RENDERABLE / HIT GEOMETRY ============ */
function buildShapes(photo){
  const mat = photoMat(photo);
  const M = p => fwd(mat, mirrorIfRight(photo,p));
  const out = {};
  for(const key in ANATOMY){
    const s = ANATOMY[key];
    let fillPoly=null, centerLine=null, dot=null, vert=null, fanLines=null;
    if(s.outline){
      const sm = catmullRom(s.outline.concat([s.outline[0]]), 10);
      fillPoly = sm.map(M);
    } else if(s.band){
      const sm = catmullRom(s.band, 12);
      centerLine = sm.map(M);
      fillPoly = ribbon(sm, s.w, true).map(M);
    } else if(s.fan){
      fanLines = s.fan.spread.map(end=>{
        const sm = catmullRom([s.fan.origin,
          [(s.fan.origin[0]+end[0])/2, (s.fan.origin[1]+end[1])/2 - 0.05], end], 10);
        return sm.map(M);
      });
    } else if(s.vertebrae){
      const {a,b,n}=s.vertebrae;
      vert=[];
      for(let i=0;i<n;i++){
        const t=i/(n-1);
        vert.push(M([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]));
      }
      centerLine=[M(a),M(b)];
    } else if(s.dot){
      dot = M(s.dot);
    }
    out[key] = { def:s, fillPoly, centerLine, dot, vert, fanLines, anchor:M(s.anchor) };
  }
  return out;
}

/* distance from a click (fraction coords) to a structure */
function distToShape(pt, sh){
  if(sh.fillPoly){
    if(pointInPoly(pt, sh.fillPoly)) return 0;
    return ptPolylineDist(pt, sh.fillPoly.concat([sh.fillPoly[0]]));
  }
  if(sh.fanLines) return Math.min(...sh.fanLines.map(l=>ptPolylineDist(pt,l)));
  if(sh.vert) return ptPolylineDist(pt, sh.centerLine);
  if(sh.dot) return Math.hypot(pt[0]-sh.dot[0], pt[1]-sh.dot[1]);
  return Infinity;
}
function rankStructures(pt, shapes){
  return Object.keys(shapes)
    .map(k=>({key:k, name:shapes[k].def.name, sys:shapes[k].def.sys, dist:distToShape(pt,shapes[k])}))
    .sort((a,b)=>a.dist-b.dist);
}
function relevantFor(pt, shapes, thresh){
  const r = rankStructures(pt, shapes);
  let rel = r.filter(x=>x.dist < (thresh||0.09));
  if(rel.length===0) rel = r.slice(0,2);
  return rel;
}


/* ===== render.js ===== */
/* ============ TEXTBOOK PLATE RENDERER ============ */
const LAYOUT = { marginFrac:0.245, headerFrac:0.085, footerFrac:0.075 };

function plateMetrics(cw, ch){
  const ml = cw*LAYOUT.marginFrac, mr = cw*LAYOUT.marginFrac;
  const hh = ch*LAYOUT.headerFrac, fh = ch*LAYOUT.footerFrac;
  return { ml, mr, hh, fh, px:ml, py:hh, pw:cw-ml-mr, ph:ch-hh-fh };
}
/* convert fraction coords (relative to photo) -> canvas px */
function mkToPx(m){ return p => [ m.px + p[0]*m.pw, m.py + p[1]*m.ph ]; }

function strokePath(ctx, pts, close){
  ctx.beginPath();
  pts.forEach((p,i)=> i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]));
  if(close) ctx.closePath();
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

function drawPlate(ctx, photo, cw, ch, opts){
  opts = opts||{};
  const layers = opts.layers || {muscle:true,nerve:true,skeletal:true};
  const m = plateMetrics(cw,ch);
  const toPx = mkToPx(m);

  // page background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,cw,ch);

  // photo, dimmed for contrast
  ctx.save();
  ctx.beginPath(); ctx.rect(m.px,m.py,m.pw,m.ph); ctx.clip();
  ctx.drawImage(photo.img, m.px, m.py, m.pw, m.ph);
  ctx.fillStyle = 'rgba(14,22,34,0.58)';
  ctx.fillRect(m.px,m.py,m.pw,m.ph);
  ctx.fillStyle = 'rgba(210,225,240,0.10)';
  ctx.fillRect(m.px,m.py,m.pw,m.ph);
  ctx.restore();
  ctx.strokeStyle='#2a3a4d'; ctx.lineWidth=1.5;
  ctx.strokeRect(m.px,m.py,m.pw,m.ph);

  const calibrating = photo.calibDone.length < CALIB_STEPS.length;
  if(calibrating){
    photo.calibDone.forEach((k,i)=>{
      const c=photo.calib[k]; if(!c) return;
      const q=toPx([c.x,c.y]);
      ctx.beginPath(); ctx.arc(q[0],q[1],7,0,7);
      ctx.fillStyle='#31d67a'; ctx.fill();
      ctx.strokeStyle='#0b2b1a'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='bold 12px Georgia';
      ctx.fillText(String(i+1), q[0]+9, q[1]-8);
    });
    drawHeader(ctx,cw,m,photo,true);
    return {metrics:m, labels:[]};
  }

  const shapes = buildShapes(photo);
  const unit = Math.hypot(...(function(){
    const a=toPx(shapes.cspine.centerLine[0]), b=toPx(shapes.cspine.centerLine[1]);
    return [b[0]-a[0], b[1]-a[1]];
  })()) || m.pw*0.4;

  ctx.save();
  ctx.beginPath(); ctx.rect(m.px,m.py,m.pw,m.ph); ctx.clip();

  const order = ['trapezius','splenius','levator','scalene','scm','plexus','cn10','cn11','cspine','clavicle','acjoint'];
  order.forEach(key=>{
    const sh = shapes[key], d = sh.def;
    if(!layers[d.sys]) return;
    const px = pts => pts.map(toPx);

    if(sh.fillPoly){
      const P = px(sh.fillPoly);
      strokePath(ctx,P,true);
      ctx.fillStyle = hexA(d.color, d.sys==='muscle'?0.30:0.40);
      ctx.fill();
      ctx.strokeStyle = hexA(d.color,0.95);
      ctx.lineWidth = Math.max(1.4, unit*0.012);
      ctx.stroke();
      if(d.sys==='muscle' && sh.centerLine){
        // striations along muscle belly
        const C = px(sh.centerLine);
        ctx.save(); ctx.globalAlpha=0.35;
        ctx.strokeStyle=hexA(d.color,0.9); ctx.lineWidth=Math.max(0.6,unit*0.004);
        for(let i=1;i<C.length-1;i+=3){
          const a=C[i-1], b=C[i+1];
          let dx=b[0]-a[0], dy=b[1]-a[1];
          const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
          const nx=-dy*unit*0.035, ny=dx*unit*0.035;
          ctx.beginPath();
          ctx.moveTo(C[i][0]-nx, C[i][1]-ny);
          ctx.lineTo(C[i][0]+nx, C[i][1]+ny);
          ctx.stroke();
        }
        ctx.restore();
      }
    }
    if(sh.fanLines){
      sh.fanLines.forEach(l=>{
        const P=px(l);
        strokePath(ctx,P,false);
        ctx.strokeStyle=hexA(d.color,0.95);
        ctx.lineWidth=Math.max(1.6,unit*0.016);
        ctx.lineCap='round'; ctx.stroke();
      });
    }
    if(sh.vert){
      const C=px(sh.centerLine);
      strokePath(ctx,C,false);
      ctx.strokeStyle=hexA(d.color,0.55); ctx.lineWidth=Math.max(1.2,unit*0.01); ctx.stroke();
      px(sh.vert).forEach((q,i)=>{
        const rw=unit*0.045, rh=unit*0.026;
        ctx.save(); ctx.translate(q[0],q[1]);
        ctx.beginPath(); ctx.ellipse(0,0,rw,rh,0,0,7);
        ctx.fillStyle=hexA(d.color,0.92); ctx.fill();
        ctx.strokeStyle='#5b7383'; ctx.lineWidth=1; ctx.stroke();
        ctx.restore();
      });
    }
    if(sh.dot){
      const q=toPx(sh.dot);
      ctx.beginPath(); ctx.arc(q[0],q[1],Math.max(4,unit*0.035),0,7);
      ctx.fillStyle=hexA(d.color,0.95); ctx.fill();
      ctx.strokeStyle='#20343f'; ctx.lineWidth=1.4; ctx.stroke();
    }
  });

  // tender zones
  (photo.marks||[]).forEach((mk,i)=>{
    const q=toPx([mk.x,mk.y]);
    const r=Math.max(11, unit*0.085);
    ctx.save();
    ctx.beginPath(); ctx.arc(q[0],q[1],r,0,7);
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=Math.max(3,unit*0.016); ctx.stroke();
    ctx.beginPath(); ctx.arc(q[0],q[1],r,0,7);
    ctx.strokeStyle='#ff2f6d'; ctx.lineWidth=Math.max(1.8,unit*0.009); ctx.stroke();
    ctx.beginPath(); ctx.arc(q[0],q[1],r*0.18,0,7);
    ctx.fillStyle='#ff2f6d'; ctx.fill();
    ctx.restore();
    const tag='T'+(i+1);
    const fs=Math.max(11,unit*0.075);
    ctx.font='bold '+fs+'px Georgia';
    const tw=ctx.measureText(tag).width;
    const bx=q[0]+r+3, by=q[1]-fs*0.9;
    ctx.fillStyle='rgba(255,255,255,0.94)';
    ctx.fillRect(bx,by,tw+8,fs+6);
    ctx.strokeStyle='#ff2f6d'; ctx.lineWidth=1.2;
    ctx.strokeRect(bx,by,tw+8,fs+6);
    ctx.fillStyle='#c11d4f';
    ctx.fillText(tag,bx+4,by+fs+1);
  });
  ctx.restore();

  const labels = drawLabels(ctx, photo, shapes, m, toPx, layers, cw, ch);
  drawHeader(ctx,cw,m,photo,false);
  drawFooter(ctx,cw,ch,m,layers);
  return {metrics:m, labels};
}

function drawHeader(ctx,cw,m,photo,calibrating){
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cw,m.hh);
  const fs=Math.max(13, cw*0.021);
  ctx.font='bold '+fs+'px Georgia';
  ctx.fillStyle='#16283a';
  const t='ANATOMICAL PLATE — '+(photo.side==='left'?'LEFT':'RIGHT')+' NECK & SHOULDER';
  ctx.textAlign='center';
  ctx.fillText(t, cw/2, m.hh*0.52);
  ctx.font='italic '+Math.max(9,fs*0.62)+'px Georgia';
  ctx.fillStyle='#6c7c8c';
  ctx.fillText(calibrating?'Calibration in progress':'Educational reference — schematic overlay, not medical imaging',
    cw/2, m.hh*0.84);
  ctx.textAlign='left';
  ctx.strokeStyle='#c9d4de'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cw*0.06,m.hh-1); ctx.lineTo(cw*0.94,m.hh-1); ctx.stroke();
}
function drawFooter(ctx,cw,ch,m,layers){
  const y=ch-m.fh;
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,y,cw,m.fh);
  ctx.strokeStyle='#c9d4de'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cw*0.06,y); ctx.lineTo(cw*0.94,y); ctx.stroke();
  const fs=Math.max(9,cw*0.014);
  ctx.font=fs+'px Georgia';
  const items=[];
  if(layers.muscle) items.push(['Muscles','#d9463d']);
  if(layers.nerve) items.push(['Nerves','#f0b429']);
  if(layers.skeletal) items.push(['Bone & Joints','#cfe8f2']);
  items.push(['Tender Zone','#ff2f6d']);
  let tw=0; items.forEach(it=>{ tw+=ctx.measureText(it[0]).width+34; });
  let x=(cw-tw)/2;
  items.forEach(it=>{
    ctx.fillStyle=it[1];
    ctx.fillRect(x, y+m.fh*0.42, fs*0.95, fs*0.95);
    ctx.strokeStyle='#8fa0ae'; ctx.lineWidth=0.8;
    ctx.strokeRect(x, y+m.fh*0.42, fs*0.95, fs*0.95);
    ctx.fillStyle='#3d4d5c';
    ctx.fillText(it[0], x+fs*1.5, y+m.fh*0.42+fs*0.9);
    x+=ctx.measureText(it[0]).width+34;
  });
}

/* margin labels with leader lines, auto-fitted to margin width */
function fitText(ctx, text, maxW){
  if(ctx.measureText(text).width<=maxW) return [text];
  const words=text.split(' ');
  if(words.length===1){
    let t=text;
    while(t.length>3 && ctx.measureText(t+'.').width>maxW) t=t.slice(0,-1);
    return [t+(t.length<text.length?'.':'')];
  }
  const lines=[]; let cur=words[0];
  for(let i=1;i<words.length;i++){
    if(ctx.measureText(cur+' '+words[i]).width<=maxW) cur+=' '+words[i];
    else { lines.push(cur); cur=words[i]; }
  }
  lines.push(cur);
  return lines.slice(0,2);
}
function drawLabels(ctx, photo, shapes, m, toPx, layers, cw, ch){
  const pad=8;
  const maxW=m.ml-pad*2;
  let fs=Math.max(8, Math.min(cw*0.0135, maxW*0.16));
  const entries=[];
  for(const key in shapes){
    const sh=shapes[key], d=sh.def;
    if(!layers[d.sys]) continue;
    const a=toPx(sh.anchor);
    if(a[0]<m.px-4||a[0]>m.px+m.pw+4||a[1]<m.py-4||a[1]>m.py+m.ph+4) continue;
    entries.push({key, def:d, anchor:a, side: a[0] < m.px+m.pw*0.5 ? 'L':'R'});
  }
  ['L','R'].forEach(side=>{
    const list=entries.filter(e=>e.side===side).sort((a,b)=>a.anchor[1]-b.anchor[1]);
    if(!list.length) return;
    const lineH=fs*2.9;
    const total=list.length*lineH;
    const start=m.py+Math.max(0,(m.ph-total)/2);
    list.forEach((e,i)=>{ e.labelY=start+i*lineH+lineH*0.45; });
    list.forEach(e=>{
      const tx = side==='L' ? m.ml-pad : cw-m.mr+pad;
      ctx.textAlign = side==='L' ? 'right' : 'left';
      ctx.strokeStyle='#5a6b7a'; ctx.lineWidth=0.9;
      ctx.beginPath();
      ctx.moveTo(e.anchor[0], e.anchor[1]);
      const elbowX = side==='L' ? m.px+6 : m.px+m.pw-6;
      ctx.lineTo(elbowX, e.anchor[1]);
      ctx.lineTo(tx, e.labelY);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(e.anchor[0],e.anchor[1],3.4,0,7);
      ctx.fillStyle=e.def.color; ctx.fill();
      ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.2; ctx.stroke();
      ctx.font='bold '+fs+'px Georgia';
      ctx.fillStyle='#16283a';
      const nameLines=fitText(ctx,(e.def.short||e.def.name).toUpperCase(),maxW);
      nameLines.forEach((ln,li)=>ctx.fillText(ln,tx,e.labelY+li*fs*1.12));
      ctx.font='italic '+(fs*0.82)+'px Georgia';
      ctx.fillStyle='#7b8b9a';
      ctx.fillText(SYS_META[e.def.sys].label, tx, e.labelY+nameLines.length*fs*1.12);
    });
  });
  ctx.textAlign='left';
  return entries;
}

function zoneLabel(pi,mi){ return 'T'+(mi+1)+(window.__multi?(' (Photo '+(pi+1)+')'):''); }

function collectAnalysis(){
  const zones=[]; const relMap={};
  Object.keys(ANATOMY).forEach(k=>relMap[k]=[]);
  photos.forEach((p,pi)=>{
    if(p.calibDone.length<CALIB_STEPS.length) return;
    const shapes=buildShapes(p);
    (p.marks||[]).forEach((mk,mi)=>{
      const ranked=rankStructures([mk.x,mk.y],shapes);
      const rel=relevantFor([mk.x,mk.y],shapes);
      const z={ id:'T'+(mi+1), photo:pi+1, side:p.side, mark:mk,
                rel:rel.map(r=>r.key), ranked };
      zones.push(z);
      rel.forEach(r=>relMap[r.key].push((photos.length>1?('P'+(pi+1)+'-'):'')+'T'+(mi+1)));
    });
  });
  return {zones, relMap};
}
function likelihood(count,total){
  if(total===0) return 'REFERENCE';
  const f=count/total;
  if(f>=0.99) return 'VERY HIGH';
  if(f>=0.5) return 'HIGH';
  if(f>0) return 'MODERATE';
  return 'LOW';
}

      'Nothing here constitutes a diagnosis. A qualified healthcare provider must perform a clinical examination to determine '+
      'the cause of any symptoms.';
    const dl=doc.splitTextToSize(disc,CW); doc.text(dl,L,y);

    doc.save('Anatomy_Guide.pdf');
    msg.innerHTML='<div class="info success">✅ Report generated — check Downloads / Files.</div>';
  }catch(err){
    console.error(err);
    msg.innerHTML='<div class="info errbox">❌ Error: '+err.message+'</div>';
  }
}

/* ============ STATE + UI ============ */
let photos=[], curIdx=0, pending=null;
let LAYERS={muscle:true,nerve:true,skeletal:true};

document.getElementById('files').addEventListener('change',function(e){
  const list=Array.from(e.target.files); if(!list.length) return;
  photos=[]; let done=0;
  list.forEach(f=>{
    const r=new FileReader();
    r.onload=ev=>{ const img=new Image();
      img.onload=()=>{ photos.push({img,side:'left',calib:{},calibDone:[],marks:[]}); done++;
        if(done===list.length){ showList(); document.getElementById('toS2').disabled=false; } };
      img.src=ev.target.result; };
    r.readAsDataURL(f);
  });
});
function showList(){
  const el=document.getElementById('photoList'); el.innerHTML='';
  photos.forEach((_,i)=>{ const d=document.createElement('div'); d.className='photo-item';
    d.innerHTML='Photograph '+(i+1)+' <button class="small gray" onclick="delPhoto('+i+')">Remove</button>';
    el.appendChild(d); });
}
function delPhoto(i){ photos.splice(i,1); showList(); if(!photos.length) document.getElementById('toS2').disabled=true; }
function startWork(){ curIdx=0; goScreen(2); loadPhoto(); }
function goScreen(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s'+n).classList.add('active');
  if(n===3) buildReview();
}
function sizeCanvas(){
  const cv=document.getElementById('canvas');
  const w=cv.parentElement.clientWidth-2;
  const img=photos[curIdx].img;
  const inner=1-LAYOUT.headerFrac-LAYOUT.footerFrac;
  const photoW=w*(1-2*LAYOUT.marginFrac);
  const photoH=photoW*(img.height/img.width);
  cv.width=w; cv.height=Math.round(photoH/inner);
}
function loadPhoto(){
  sizeCanvas();
  document.getElementById('pcount').textContent='('+(curIdx+1)+' of '+photos.length+')';
  document.getElementById('prevBtn').style.visibility=curIdx===0?'hidden':'visible';
  document.getElementById('nextBtn').textContent=curIdx===photos.length-1?'Finish → Review':'Next →';
  updateSide(); redraw(); updateInstr();
}
function setSide(s){ photos[curIdx].side=s; updateSide(); redraw(); }
function updateSide(){
  const p=photos[curIdx];
  document.getElementById('sideL').className='small'+(p.side==='left'?' on':'');
  document.getElementById('sideR').className='small'+(p.side==='right'?' on':'');
}
function toggleLayer(k){
  LAYERS[k]=!LAYERS[k];
  document.getElementById(k==='muscle'?'tgM':k==='nerve'?'tgN':'tgS').className='small'+(LAYERS[k]?' on':'');
  redraw();
}
function curStep(p){ return CALIB_STEPS[p.calibDone.length]||null; }
function updateInstr(){
  const p=photos[curIdx], el=document.getElementById('instr'), st=curStep(p);
  if(st){
    el.innerHTML='<b>Calibration '+(p.calibDone.length+1)+' of '+CALIB_STEPS.length+'</b><br>'+st.label+
      (st.optional?'<br><i style="color:#7b8b9a">Optional — improves accuracy</i>':'');
    document.getElementById('skipRow').style.display=st.optional?'flex':'none';
  }else{
    el.innerHTML='<b>Calibrated.</b> Tap the plate to mark a tender area. Marked: '+p.marks.length;
    document.getElementById('skipRow').style.display='none';
  }
}
function recalib(){ const p=photos[curIdx]; p.calib={}; p.calibDone=[]; p.marks=[]; redraw(); updateInstr(); }
function undoPt(){ const p=photos[curIdx];
  if(p.marks.length) p.marks.pop();
  else if(p.calibDone.length){ const k=p.calibDone.pop(); delete p.calib[k]; }
  redraw(); updateInstr(); }
function skipPt(){ const p=photos[curIdx], st=curStep(p);
  if(!st||!st.optional) return; p.calib[st.key]=null; p.calibDone.push(st.key); redraw(); updateInstr(); }
function prevPhoto(){ if(curIdx>0){ curIdx--; loadPhoto(); } }
function nextPhoto(){ const p=photos[curIdx];
  if(curStep(p)){ alert('Please finish calibrating this photograph first.'); return; }
  if(curIdx<photos.length-1){ curIdx++; loadPhoto(); } else goScreen(3); }

document.getElementById('canvas').addEventListener('click',function(e){
  const p=photos[curIdx], cv=document.getElementById('canvas');
  const rect=cv.getBoundingClientRect();
  const sx=cv.width/rect.width, sy=cv.height/rect.height;
  const x=(e.clientX-rect.left)*sx, y=(e.clientY-rect.top)*sy;
  const m=plateMetrics(cv.width,cv.height);
  const fx=(x-m.px)/m.pw, fy=(y-m.py)/m.ph;
  if(fx<0||fx>1||fy<0||fy>1) return;   // ignore taps in the margins
  const st=curStep(p);
  if(st){ p.calib[st.key]={x:fx,y:fy}; p.calibDone.push(st.key); redraw(); updateInstr(); return; }
  const shapes=buildShapes(p);
  const rel=relevantFor([fx,fy],shapes);
  pending={x:fx,y:fy,rel:rel.map(r=>r.key)};
  document.getElementById('loc').textContent=rel.slice(0,3).map(r=>r.name).join(', ');
  document.getElementById('trigger').value=''; document.getElementById('type').value='';
  document.getElementById('sev').value=5; document.getElementById('num').textContent=5;
  document.getElementById('modal').classList.add('active');
});
function closeModal(){ document.getElementById('modal').classList.remove('active'); }
function saveMark(){
  const t=document.getElementById('trigger').value, ty=document.getElementById('type').value, sv=document.getElementById('sev').value;
  if(!t||!ty){ alert('Please select both a trigger and a pain character.'); return; }
  photos[curIdx].marks.push({x:pending.x,y:pending.y,trigger:t,type:ty,sev:sv,rel:pending.rel});
  closeModal(); redraw(); updateInstr();
}
function redraw(){
  const cv=document.getElementById('canvas');
  drawPlate(cv.getContext('2d'), photos[curIdx], cv.width, cv.height, {layers:LAYERS});
}
window.addEventListener('resize',()=>{ if(photos.length && document.getElementById('s2').classList.contains('active')){ sizeCanvas(); redraw(); } });

function buildReview(){
  let h='';
  photos.forEach((p,i)=>{
    const ok=!curStep(p);
    h+='<div class="review-item"><b>Plate '+(i+1)+' — '+p.side+' side</b><br>Calibration: '+(ok?'complete':'INCOMPLETE')+'<br>';
    if(!p.marks.length) h+='<i>No tender areas marked</i>';
    else{
      const shapes=ok?buildShapes(p):null;
      p.marks.forEach((m,j)=>{
        const names=shapes? relevantFor([m.x,m.y],shapes).slice(0,3).map(r=>r.name).join(', ') : '—';
        h+='<b>T'+(j+1)+'</b> · '+m.type+' · '+m.trigger+' · '+m.sev+'/10<br><span style="color:#7b8b9a">over '+names+'</span><br>';
      });
    }
    h+='</div>';
  });
  document.getElementById('review').innerHTML=h||'<p>No photographs.</p>';
}

</script>
